<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#180e29"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="235" r="175" stroke="url(#neonGrad)" stroke-width="8" fill="none" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="235" r="165" stroke="url(#neonGrad)" stroke-width="4" fill="#0a0f20" fill-opacity="0.8"/>

  <!-- Decorative Orbit Dots -->
  <circle cx="256" cy="70" r="8" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="421" cy="235" r="7" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="91" cy="235" r="7" fill="#a855f7" filter="url(#glow)"/>

  <!-- Center SV Monogram -->
  <text x="256" y="280" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" 
        font-size="140" 
        font-weight="900" 
        letter-spacing="-4"
        text-anchor="middle" 
        fill="url(#neonGrad)"
        filter="url(#glow)">SV</text>

  <!-- Brand Label -->
  <text x="256" y="375" 
        font-family="'JetBrains Mono', 'Segoe UI', monospace, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="6"
        text-anchor="middle" 
        fill="#ffffff" opacity="0.95">SAQIB VISUALS</text>

  <text x="256" y="410" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="3"
        text-anchor="middle" 
        fill="#06b6d4">AI &amp; SMM HUB</text>
</svg>